{% extends "school/base.html" %}
{% block title %}تغيير كلمة المرور{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:30px auto">
  <h2>تغيير كلمة المرور</h2>
  <form method="post">
    {% csrf_token %}
    {% for f in form %}
      <div class="form-row" style="flex-direction:column;margin-bottom:10px">
        <label>{{ f.label }} {{ f }}</label>
        {% for e in f.errors %}<div class="alert error">{{ e }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button class="btn" type="submit">حفظ</button>
  </form>
</div>
{% endblock %}
